name: dbt PR cleanup

# Drop the PR's sandbox schema when the pull request is merged or closed,
# so ci_development does not fill up with stale tables.

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "assignment_dbt/**"
      - ".github/workflows/dbt_*.yml"
      - ".github/actions/setup-dbt-assignment/**"

permissions:
  contents: read

env:
  DBT_TARGET: ci
  DBT_CI_SCHEMA: pr_${{ github.event.pull_request.number }}
  DBT_PROFILES_DIR: .
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_CI_TOKEN }}
  DO_NOT_TRACK: "1"

jobs:
  drop-schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment_dbt/cdc_marketing
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dbt-assignment
      - name: Drop ci_development.pr_<n>
        run: uv run dbt run-operation drop_ci_schema
