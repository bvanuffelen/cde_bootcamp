# No secrets in this file: every credential is read from environment variables
# (locally from .env, in GitHub Actions from repository secrets).
#
#   target      catalog          schema            auth
#   dev         ci_development   dbt_<you>         personal access token (developer)
#   ci          ci_development   pr_<PR number>    personal access token (GitHub secret)
#   production  gold_production  marketing         Service Principal, OAuth M2M

cdc_marketing:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  outputs:
    dev: &dev
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: ci_development
      schema: "{{ env_var('DBT_DEV_SCHEMA', 'dbt_dev') }}"
      threads: 8

    ci:
      <<: *dev
      schema: "{{ env_var('DBT_CI_SCHEMA') }}"

    production: &production
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DATABRICKS_CLIENT_SECRET') }}"
      catalog: gold_production
      schema: marketing
      threads: 8
      connect_retries: 5
      connect_timeout: 60

# Profile used by the Elementary CLI (`edr report`) to read test history.
elementary:
  target: production
  outputs:
    production:
      <<: *production
      catalog: silver_production
      schema: elementary
